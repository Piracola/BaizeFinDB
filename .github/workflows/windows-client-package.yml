name: Package Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-client-package.yml"
      - "clients/windows/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  package-windows-client:
    name: Package Windows client
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync packaging dependencies
        run: uv sync --group package

      - name: Check packaging prerequisites
        run: >
          uv run --group package powershell -ExecutionPolicy Bypass
          -File clients/windows/package-client.ps1
          -CheckOnly
          -CheckJsonOutput clients/windows/package-check-evidence.ci.json

      - name: Build onedir executable
        run: >
          uv run --group package powershell -ExecutionPolicy Bypass
          -File clients/windows/package-client.ps1
          -Clean

      - name: Validate packaged launcher imports
        shell: powershell
        run: |
          $env:BAIZEFINDB_PACKAGED_IMPORT_CHECK = "1"
          & clients/windows/dist/BaizeFinDB-Windows-Client/BaizeFinDB-Windows-Client.exe
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: powershell
        run: |
          & clients/windows/package-installer.ps1 -AppVersion "0.1.0-preview.${{ github.run_number }}"

      - name: Validate Windows installer artifact
        shell: powershell
        run: |
          if (-not (Test-Path "clients/windows/dist/installer/BaizeFinDB-Windows-Client-Setup.exe")) {
            Write-Error "Installer artifact was not created."
            exit 1
          }

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaizeFinDB-Windows-Client-${{ github.sha }}
          path: |
            clients/windows/dist/BaizeFinDB-Windows-Client/**
            clients/windows/package-check-evidence.ci.json
          if-no-files-found: error

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaizeFinDB-Windows-Client-Setup-${{ github.sha }}
          path: clients/windows/dist/installer/BaizeFinDB-Windows-Client-Setup.exe
          if-no-files-found: error
