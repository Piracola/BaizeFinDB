x-api-base: &api-base
  build:
    context: .
    dockerfile: Dockerfile
  image: baizefindb-api:latest
  env_file:
    - .env
  environment:
    APP_ENV: server
    DATABASE_URL: ${SERVER_DATABASE_URL:-postgresql+asyncpg://baizefindb:baizefindb@postgres:5432/baizefindb}
    REDIS_URL: ${SERVER_REDIS_URL:-redis://redis:6379/0}
    CELERY_BROKER_URL: ${SERVER_REDIS_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${SERVER_REDIS_URL:-redis://redis:6379/0}
    RADAR_SCAN_INTERVAL_SECONDS: ${RADAR_SCAN_INTERVAL_SECONDS:-300}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *api-base
    container_name: baizefindb-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *api-base
    container_name: baizefindb-worker
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
      ]

  beat:
    <<: *api-base
    container_name: baizefindb-beat
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
